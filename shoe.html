<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoe Details | FAST BREAK</title>
    <meta
      name="description"
      content="View detailed NBA signature shoe information on FAST BREAK."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" id="home">
      <div class="container nav-wrap">
        <a class="brand" href="index.html" aria-label="FAST BREAK home">
          <span class="logo" aria-hidden="true">
            <span class="logo-letter">F</span>
            <span class="logo-letter">B</span>
          </span>
          <span class="brand-text">FAST BREAK</span>
        </a>
        <nav class="top-nav" aria-label="Primary">
          <a href="shoes.html">Shoes</a>
          <a href="contact.html">Contact Us</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="info" id="shoe-detail-page">
        <div class="container">
          <a href="shoes.html" class="shoe-back-link">Back to Shoes</a>
          <section class="shoe-detail-panel">
            <div class="shoe-detail-media">
              <img id="shoe-detail-image" src="" alt="" />
            </div>
            <div class="shoe-detail-copy">
              <h2 id="shoe-detail-name"></h2>
              <p class="shoe-detail-price" id="shoe-detail-price"></p>
              <section class="shoe-color-section" aria-label="Choose color">
                <p class="shoe-color-label">
                  Color: <span id="shoe-active-color">Original</span>
                </p>
                <div class="shoe-color-options" id="shoe-color-options"></div>
              </section>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p><strong>FAST BREAK</strong></p>
        <p id="year"></p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
