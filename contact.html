<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | FAST BREAK</title>
    <meta
      name="description"
      content="Contact FAST BREAK for questions about NBA signature shoes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" id="home">
      <div class="container nav-wrap">
        <a class="brand" href="index.html" aria-label="FAST BREAK home">
          <span class="logo" aria-hidden="true">
            <span class="logo-letter">F</span>
            <span class="logo-letter">B</span>
          </span>
          <span class="brand-text">FAST BREAK</span>
        </a>
        <nav class="top-nav" aria-label="Primary">
          <a href="shoes.html">Shoes</a>
          <a href="contact.html">Contact Us</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="info">
        <div class="container">
          <h2>Contact Us</h2>
          <p>Send us a message and our team will get back to you.</p>
          <form class="contact-form" id="contact-form" action="#" method="post" novalidate>
            <div class="form-row">
              <label for="full-name">Full Name</label>
              <input id="full-name" name="full-name" type="text" placeholder="Your name" />
              <p class="form-error" id="full-name-error" aria-live="polite"></p>
            </div>
            <div class="form-row">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="you@example.com" />
              <p class="form-or">OR</p>
            </div>
            <div class="form-row">
              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" placeholder="(555) 555-5555" />
              <p class="form-error" id="contact-method-error" aria-live="polite"></p>
            </div>
            <div class="form-row">
              <label for="subject">Subject</label>
              <input id="subject" name="subject" type="text" placeholder="How can we help?" />
              <p class="form-error" id="subject-error" aria-live="polite"></p>
            </div>
            <div class="form-row">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="6" placeholder="Write your message here"></textarea>
              <p class="form-error" id="message-error" aria-live="polite"></p>
            </div>
            <button type="button" class="contact-btn" id="contact-send-btn">Send Message</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p><strong>FAST BREAK</strong></p>
        <p id="year"></p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
